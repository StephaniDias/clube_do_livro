name: clube_do_livro
description: "App do Clube do Livro - leitura, votação e encontros"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # UI / utilidades
  google_fonts: ^6.2.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  provider: ^6.1.2
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
